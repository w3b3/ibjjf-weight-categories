<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="manifest.json">
    <title>IBJJF Weight Category</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
</head>
<body class="bg-light text-dark">
<div class="container py-4">
    <div class="row mb-2">
        <div class="col-12 text-center">
            <h1 class="h4 fw-bold mb-0" id="title_weight_categories">Loading...</h1>
        </div>
    </div>
    <header class="row align-items-center mb-2 border-bottom pb-2 g-2 flex-wrap" role="banner" aria-label="Main header">
        <!-- header now only for layout, no title, no flags, no dropdown -->
    </header>
    <div id="user-info-card" style="display:none;"></div>
    <div class="row mb-3">
        <div class="col-12 d-flex justify-content-center">
            <div class="btn-group w-100 w-sm-auto" role="group" aria-label="Gender category selector">
                <select class="form-select form-select-sm w-auto" id="gender-category-select" aria-label="Category: Male Adult">
                    <option value="male" selected>MALE - ADULT</option>
                    <option value="female">FEMALE - ADULT</option>
                </select>
            </div>
        </div>
    </div>
    <main>
        <div class="row g-3" id="category-buttons-container"></div>
    </main>
    <footer class="mt-5 pt-4 border-top">
        <div class="d-flex flex-column align-items-center gap-2">
            <span class="fw-semibold">Language</span>
            <div class="d-flex gap-3 justify-content-center">
                <img alt="CA Flag" id="usa-flag" onclick="setTheme('usa')" src="https://flagsapi.com/CA/flat/40.png" style="cursor:pointer; width:40px; height:40px;"/>
                <img alt="Brazil Flag" id="brazil-flag" onclick="setTheme('brazil')" src="https://flagsapi.com/BR/flat/40.png" style="cursor:pointer; width:40px; height:40px;"/>
            </div>
        </div>
    </footer>
</div>
<!-- Modal for user info -->
<div id="modal-backdrop" class="modal fade" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="modal-title">Enter Your Information</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="modal-cancel"></button>
      </div>
      <form id="user-info-form">
        <div class="modal-body">
          <div class="mb-3">
            <label for="user-name" class="form-label">Name *</label>
            <input type="text" class="form-control" id="user-name" name="user-name" required autocomplete="name" />
          </div>
          <div class="mb-3">
            <label for="user-belt" class="form-label">Belt *</label>
            <select class="form-select" id="user-belt" name="user-belt" required>
              <option value="">Select belt</option>
              <option value="White">White</option>
              <option value="Blue">Blue</option>
              <option value="Purple">Purple</option>
              <option value="Brown">Brown</option>
              <option value="Black">Black</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="user-age" class="form-label">Age *</label>
            <input type="number" class="form-control" id="user-age" name="user-age" min="4" max="100" required autocomplete="age" />
          </div>
          <div class="mb-3">
            <label for="user-email" class="form-label">Email <span class="text-muted small">(optional, receive a summary if interested)</span></label>
            <input type="email" class="form-control" id="user-email" name="user-email" autocomplete="email" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="modal-cancel-footer">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const translations = {
        "en-us": {
            male: {
                Rooster: { name: "Rooster", weightKg: "57.5 kg", weightLbs: "127 lbs" },
                "Light Feather": { name: "Light Feather", weightKg: "64 kg", weightLbs: "141 lbs" },
                Feather: { name: "Feather", weightKg: "70 kg", weightLbs: "154 lbs" },
                Light: { name: "Light", weightKg: "76 kg", weightLbs: "167.5 lbs" },
                Middle: { name: "Middle", weightKg: "82.3 kg", weightLbs: "181.5 lbs" },
                "Medium Heavy": { name: "Medium Heavy", weightKg: "88.3 kg", weightLbs: "194.5 lbs" },
                Heavy: { name: "Heavy", weightKg: "94.3 kg", weightLbs: "208 lbs" },
                "Super Heavy": { name: "Super Heavy", weightKg: "100.5 kg", weightLbs: "221.5 lbs" },
                "Ultra Heavy": { name: "Ultra Heavy", weightKg: "> 100.5 kg", weightLbs: "> 221.5 lbs" },
            },
            female: {
                Rooster: { name: "Rooster", weightKg: "47.5 kg", weightLbs: "105 lbs" },
                "Light Feather": { name: "Light Feather", weightKg: "52.5 kg", weightLbs: "115.7 lbs" },
                Feather: { name: "Feather", weightKg: "57.5 kg", weightLbs: "126.8 lbs" },
                Light: { name: "Light", weightKg: "62.5 kg", weightLbs: "138 lbs" },
                Middle: { name: "Middle", weightKg: "69 kg", weightLbs: "152.1 lbs" },
                "Medium Heavy": { name: "Medium Heavy", weightKg: "74 kg", weightLbs: "163.1 lbs" },
                Heavy: { name: "Heavy", weightKg: "79.3 kg", weightLbs: "174.8 lbs" },
                "Super Heavy": { name: "Super Heavy", weightKg: "> 79.3 kg", weightLbs: "> 174.8 lbs" },
            },
        },
        "pt-br": {
            male: {
                Rooster: { name: "Galo", weightKg: "57,5 kg", weightLbs: "127 lbs" },
                "Light Feather": { name: "Pluma Leve", weightKg: "64 kg", weightLbs: "141 lbs" },
                Feather: { name: "Pluma", weightKg: "70 kg", weightLbs: "154 lbs" },
                Light: { name: "Leve", weightKg: "76 kg", weightLbs: "167,5 lbs" },
                Middle: { name: "Médio", weightKg: "82,3 kg", weightLbs: "181,5 lbs" },
                "Medium Heavy": { name: "Meio-Pesado", weightKg: "88,3 kg", weightLbs: "194,5 lbs" },
                Heavy: { name: "Pesado", weightKg: "94,3 kg", weightLbs: "208 lbs" },
                "Super Heavy": { name: "Super Pesado", weightKg: "100,5 kg", weightLbs: "221,5 lbs" },
                "Ultra Heavy": { name: "Pesadíssimo", weightKg: "> 100,5 kg", weightLbs: "> 221,5 lbs" },
            },
            female: {
                Rooster: { name: "Galo", weightKg: "47,5 kg", weightLbs: "105 lbs" },
                "Light Feather": { name: "Pluma Leve", weightKg: "52,5 kg", weightLbs: "115,7 lbs" },
                Feather: { name: "Pluma", weightKg: "57,5 kg", weightLbs: "126,8 lbs" },
                Light: { name: "Leve", weightKg: "62,5 kg", weightLbs: "138 lbs" },
                Middle: { name: "Médio", weightKg: "69 kg", weightLbs: "152,1 lbs" },
                "Medium Heavy": { name: "Meio-Pesado", weightKg: "74 kg", weightLbs: "163,1 lbs" },
                Heavy: { name: "Pesado", weightKg: "79,3 kg", weightLbs: "174,8 lbs" },
                "Super Heavy": { name: "Super Pesado", weightKg: "> 79,3 kg", weightLbs: "> 174,8 lbs" },
            },
        },
    };

    // --- User Info Modal Logic ---
    function showModal() {
      const modal = new bootstrap.Modal(document.getElementById('modal-backdrop'));
      modal.show();
      setTimeout(() => document.getElementById('user-name').focus(), 300);
    }
    function hideModal() {
      const modal = bootstrap.Modal.getInstance(document.getElementById('modal-backdrop'));
      if (modal) modal.hide();
      document.getElementById('user-info-form').reset();
    }
    document.getElementById('modal-cancel').onclick = hideModal;
    document.getElementById('modal-cancel-footer').onclick = hideModal;
    document.getElementById('modal-backdrop').addEventListener('hidden.bs.modal', () => {
      document.getElementById('user-info-form').reset();
    });
    document.getElementById('user-info-form').onsubmit = function(e) {
      e.preventDefault();
      const name = document.getElementById('user-name').value.trim();
      const belt = document.getElementById('user-belt').value;
      const age = document.getElementById('user-age').value;
      const email = document.getElementById('user-email').value.trim();
      if (!name || !belt || !age) return;
      const userInfo = { name, belt, age, email, weightClass: modalWeightClass };
      localStorage.setItem('userInfo', JSON.stringify(userInfo));
      hideModal();
      renderUserInfo();
      disableAllButtons();
    };
    let modalWeightClass = null;

    // --- User Info Card ---
    function renderUserInfo() {
      const userInfo = JSON.parse(localStorage.getItem('userInfo') || 'null');
      const card = document.getElementById('user-info-card');
      if (!userInfo) {
        card.style.display = 'none';
        return;
      }
      card.style.display = 'block';
      card.innerHTML = `
        <div class="card shadow-sm mb-4" style="max-width: 400px; margin:auto;">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-title mb-0">Your Information</h5>
              <button class="btn btn-outline-danger btn-sm" onclick="clearUserData()" title="Clear and restart" aria-label="Clear and restart">
                <span aria-hidden="true">&#x21bb;</span> Restart
              </button>
            </div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item"><strong>Name:</strong> ${userInfo.name}</li>
              <li class="list-group-item"><strong>Belt:</strong> ${userInfo.belt}</li>
              <li class="list-group-item"><strong>Age:</strong> ${userInfo.age}</li>
              <li class="list-group-item"><strong>Email:</strong> ${userInfo.email ? userInfo.email : '<span class="text-muted">Not provided</span>'}</li>
              <li class="list-group-item"><strong>Weight Class:</strong> ${userInfo.weightClass}</li>
            </ul>
          </div>
        </div>
      `;
    }
    function clearUserData() {
      localStorage.removeItem('userInfo');
      renderUserInfo();
      enableAllButtons();
    }

    // --- Category Buttons as Cards ---
    const categoryButtonsContainer = document.getElementById("category-buttons-container");
    let selectedGender = localStorage.getItem('gender') || 'male';
    document.getElementById('gender-category-select').value = selectedGender;
    document.getElementById('gender-category-select').onchange = function() {
        selectedGender = this.value;
        localStorage.setItem('gender', selectedGender);
        loadCategories(savedLang, selectedGender);
    };
    function disableAllButtons() {
      const buttons = document.getElementsByClassName('category-button');
      Array.from(buttons).forEach((button) => {
        button.classList.add('disabled');
        button.disabled = true;
      });
    }
    function enableAllButtons() {
      const buttons = document.getElementsByClassName('category-button');
      Array.from(buttons).forEach((button) => {
        button.classList.remove('disabled');
        button.disabled = false;
      });
    }
    function handleCategoryClick(category) {
      modalWeightClass = translations[savedLang][selectedGender][category].name;
      showModal();
    }
    function loadCategories(lang, gender) {
        categoryButtonsContainer.innerHTML = "";
        const categories = Object.keys(translations[lang][gender]);
        categories.forEach((category, idx) => {
            const localizedData = translations[lang][gender][category];
            const col = document.createElement("div");
            col.className = "col-6 col-md-4 col-lg-3 d-flex"; // 2 per row on xs/sm, 3 on md, 4 on lg+
            col.innerHTML = `
              <button class="card category-button border-0 shadow-sm flex-fill mb-2 p-0 bg-white text-dark" style="transition:box-shadow .2s;cursor:pointer;min-height:90px;" tabindex="0">
                <div class="card-body text-center py-3 py-sm-4 px-2">
                  <h5 class="card-title mb-2 fs-6 fs-sm-5">${localizedData.name}</h5>
                  <p class="card-text fw-semibold mb-0 fs-3 fs-sm-1">${localizedData.weightKg}</p>
                </div>
              </button>
            `;
            col.querySelector('button').onclick = () => handleCategoryClick(category);
            categoryButtonsContainer.appendChild(col);
        });
        // Lock if user info exists
        if (localStorage.getItem('userInfo')) {
          disableAllButtons();
        } else {
          enableAllButtons();
        }
    }

    // --- Language/Theme ---
    function setTheme(theme) {
        if (theme === "usa") {
            document.body.classList.remove("brazil-theme");
            document.body.classList.add(theme + "-theme");
            setLanguage("en-us");
            document.getElementById("title_weight_categories").innerText =
                "IBJJF Weight Categories";
        } else {
            document.body.classList.remove("usa-theme");
            document.body.classList.add(theme + "-theme");
            setLanguage("pt-br");
            document.getElementById("title_weight_categories").innerText =
                "Categorias de Peso CBJJ";
        }
        localStorage.setItem("theme", theme);
    }
    function setLanguage(lang) {
        localStorage.setItem("language", lang);
        loadCategories(lang, selectedGender);
    }
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
        setTheme(savedTheme);
    } else {
        setTheme("usa");
    }
    const savedLang = localStorage.getItem("language") || "en-us";
    selectedGender = localStorage.getItem('gender') || 'male';
    setLanguage(savedLang);
    renderUserInfo();
</script>
</body>
</html>
