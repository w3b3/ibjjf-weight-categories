<!DOCTYPE html>

    <meta charset="UTF-8"/>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="manifest.json">
    <title>IBJJF Weight Category</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
</head>
<body class="bg-light text-dark">
<div class="container py-4">
    <div class="row mb-2">
        <div class="col-12 text-center">
            <h1 class="h4 fw-bold mb-0" id="title_weight_categories">Loading...</h1>
        </div>
    </div>
    <header class="row align-items-center mb-2 border-bottom pb-2 g-2 flex-wrap" role="banner" aria-label="Main header">
        <!-- header now only for layout, no title, no flags, no dropdown -->
    </header>
    <div id="user-info-card" style="display:none;"></div>
    <div class="row mb-3">
        <div class="col-12 d-flex justify-content-center">
            <div class="btn-group w-100 w-sm-auto" role="group" aria-label="Gender category selector">
                <select class="form-select form-select-sm w-auto" id="gender-category-select" aria-label="Category: Male Adult">
                    <option value="male-adult" selected>MALE - ADULT</option>
                    <option value="female-adult">FEMALE - ADULT</option>
                    <option value="male-master">MALE - MASTER</option>
                    <option value="female-master">FEMALE - MASTER</option>
                    <option value="male-kids">MALE - KIDS</option>
                    <option value="female-kids">FEMALE - KIDS</option>
                </select>
            </div>
        </div>
    </div>
    <main>
        <div class="row g-3" id="category-buttons-container"></div>
    </main>
    <footer class="mt-5 pt-4 border-top">
        <div class="d-flex flex-column align-items-center gap-2">
            <span class="fw-semibold">Language</span>
            <div class="d-flex gap-3 justify-content-center" id="language-switcher">
                <button class="btn btn-light border" id="lang-en" onclick="setTheme('usa')" aria-label="Switch to English">
                  <span style="font-size:2rem;">🇨🇦</span>
                </button>
                <button class="btn btn-light border" id="lang-pt" onclick="setTheme('brazil')" aria-label="Switch to Portuguese">
                  <span style="font-size:2rem;">🇧🇷</span>
                </button>
            </div>
        </div>
    </footer>
</div>
<!-- Modal for user info -->
<div id="modal-backdrop" class="modal fade" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="modal-title">Enter Your Information</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="modal-cancel"></button>
      </div>
      <form id="user-info-form">
        <div class="modal-body">
          <div class="mb-3">
            <label for="user-name" class="form-label">Name *</label>
            <input type="text" class="form-control" id="user-name" name="user-name" required autocomplete="name" />
          </div>
          <div class="mb-3">
            <label for="user-belt" class="form-label">Belt *</label>
            <select class="form-select" id="user-belt" name="user-belt" required>
              <option value="">Select belt</option>
              <option value="White">White</option>
              <option value="Blue">Blue</option>
              <option value="Purple">Purple</option>
              <option value="Brown">Brown</option>
              <option value="Black">Black</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="user-age" class="form-label">Age *</label>
            <input type="number" class="form-control" id="user-age" name="user-age" min="4" max="100" required autocomplete="age" />
          </div>
          <div class="mb-3">
            <label for="user-email" class="form-label">Email <span class="text-muted small">(optional, receive a summary if interested)</span></label>
            <input type="email" class="form-control" id="user-email" name="user-email" autocomplete="email" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="modal-cancel-footer">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

    function localizeForm(lang) {
      const t = formTranslations[lang];
      document.getElementById('modal-title').textContent = t.modalTitle;
      document.querySelector('label[for="user-name"]').textContent = t.name;
      document.querySelector('label[for="user-belt"]').textContent = t.belt;
      document.getElementById('user-belt').innerHTML = `<option value="">${t.selectBelt}</option>` + t.belts.map(b => `<option value="${b}">${b}</option>`).join('');
      document.querySelector('label[for="user-age"]').textContent = t.age;
      document.querySelector('label[for="user-email"]').textContent = t.email;
      document.getElementById('modal-cancel-footer').textContent = t.cancel;
      document.querySelector('#user-info-form button[type="submit"]').textContent = t.save;
    }

    // --- User Info Modal Logic ---
    function showModal() {
      const modal = new bootstrap.Modal(document.getElementById('modal-backdrop'));
      modal.show();
      setTimeout(() => document.getElementById('user-name').focus(), 300);
    }
    function hideModal() {
      const modal = bootstrap.Modal.getInstance(document.getElementById('modal-backdrop'));
      if (modal) modal.hide();
      document.getElementById('user-info-form').reset();
    }
    document.getElementById('modal-cancel').onclick = hideModal;
    document.getElementById('modal-cancel-footer').onclick = hideModal;
    document.getElementById('modal-backdrop').addEventListener('hidden.bs.modal', () => {
      document.getElementById('user-info-form').reset();
    });
    document.getElementById('user-info-form').onsubmit = function(e) {
      e.preventDefault();
      const name = document.getElementById('user-name').value.trim();
      const belt = document.getElementById('user-belt').value;
      const age = document.getElementById('user-age').value;
      const email = document.getElementById('user-email').value.trim();
      if (!name || !belt || !age) return;
      const userInfo = { name, belt, age, email, weightClass: modalWeightClass };
      localStorage.setItem('userInfo', JSON.stringify(userInfo));
      hideModal();
      renderUserInfo();
      disableAllButtons();
    };
    let modalWeightClass = null;

    // --- User Info Card ---
    function renderUserInfo() {
      const userInfo = JSON.parse(localStorage.getItem('userInfo') || 'null');
      const card = document.getElementById('user-info-card');
      if (!userInfo) {
        card.style.display = 'none';
        return;
      }
      card.style.display = 'block';
      card.innerHTML = `
        <div class="card shadow-sm mb-4" style="max-width: 400px; margin:auto;">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-title mb-0">Your Information</h5>
              <button class="btn btn-outline-danger btn-sm" onclick="clearUserData()" title="Clear and restart" aria-label="Clear and restart">
                <span aria-hidden="true">&#x21bb;</span> Restart
              </button>
            </div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item"><strong>Name:</strong> ${userInfo.name}</li>
              <li class="list-group-item"><strong>Belt:</strong> ${userInfo.belt}</li>
              <li class="list-group-item"><strong>Age:</strong> ${userInfo.age}</li>
              <li class="list-group-item"><strong>Email:</strong> ${userInfo.email ? userInfo.email : '<span class="text-muted">Not provided</span>'}</li>
              <li class="list-group-item"><strong>Weight Class:</strong> ${userInfo.weightClass}</li>
            </ul>
          </div>
        </div>
      `;
    }
    function clearUserData() {
      localStorage.removeItem('userInfo');
      renderUserInfo();
      enableAllButtons();
    }

    // --- Category Buttons as Cards ---
    const categoryButtonsContainer = document.getElementById("category-buttons-container");
    let selectedCategory = localStorage.getItem('category') || 'male-adult';
    document.getElementById('gender-category-select').value = selectedCategory;
    document.getElementById('gender-category-select').onchange = function() {
        selectedCategory = this.value;
        localStorage.setItem('category', selectedCategory);
        loadCategories(savedLang, selectedCategory);
        updateGenderDropdown();
    };
    function disableAllButtons() {
      const buttons = document.getElementsByClassName('category-button');
      Array.from(buttons).forEach((button) => {
        button.classList.add('disabled');
        button.disabled = true;
      });
    }
    function enableAllButtons() {
      const buttons = document.getElementsByClassName('category-button');
      Array.from(buttons).forEach((button) => {
        button.classList.remove('disabled');
        button.disabled = false;
      });
    }
    function handleCategoryClick(category) {
      modalWeightClass = translations[savedLang][selectedCategory][category].name;
      showModal();
    }
    function loadCategories(lang, category) {
        categoryButtonsContainer.innerHTML = "";
        const categories = Object.keys(translations[lang][category]);
        categories.forEach((cat, idx) => {
            const localizedData = translations[lang][category][cat];
            const col = document.createElement("div");
            col.className = "col-6 col-md-4 col-lg-3 d-flex";
            col.innerHTML = `
              <button class="card category-button border-0 shadow-sm flex-fill mb-2 p-0 bg-white text-dark" style="transition:box-shadow .2s;cursor:pointer;min-height:90px;" tabindex="0">
                <div class="card-body text-center py-3 py-sm-4 px-2">
                  <h5 class="card-title mb-2 fs-6 fs-sm-5">${localizedData.name}</h5>
                  <p class="card-text fw-semibold mb-0 fs-3 fs-sm-1">${localizedData.weightKg}</p>
                </div>
              </button>
            `;
            col.querySelector('button').onclick = () => handleCategoryClick(cat);
            categoryButtonsContainer.appendChild(col);
        });
        // Lock if user info exists
        if (localStorage.getItem('userInfo')) {
          disableAllButtons();
        } else {
          enableAllButtons();
        }
    }

    // --- Language/Theme ---
    function setTheme(theme) {
        if (theme === "usa") {
            document.body.classList.remove("brazil-theme");
            document.body.classList.add(theme + "-theme");
            setLanguage("en-us");
            document.getElementById("title_weight_categories").innerText =
                "IBJJF Weight Categories";
        } else {
            document.body.classList.remove("usa-theme");
            document.body.classList.add(theme + "-theme");
            setLanguage("pt-br");
            document.getElementById("title_weight_categories").innerText =
                "Categorias de Peso CBJJ";
        }
        localStorage.setItem("theme", theme);
        updateLanguageSelector();
        localizeForm(localStorage.getItem('language') || 'en-us');
    }
    function setLanguage(lang) {
        localStorage.setItem("language", lang);
        renderCategoryDropdown();
        loadCategories(lang, selectedCategory);
        localizeForm(lang);
    }
    function updateLanguageSelector() {
      const lang = localStorage.getItem("language") || "en-us";
      document.getElementById('lang-en').classList.toggle('active', lang === 'en-us');
      document.getElementById('lang-pt').classList.toggle('active', lang === 'pt-br');
      document.getElementById('lang-en').classList.toggle('border-primary', lang === 'en-us');
      document.getElementById('lang-pt').classList.toggle('border-primary', lang === 'pt-br');
      document.getElementById('lang-en').classList.toggle('fw-bold', lang === 'en-us');
      document.getElementById('lang-pt').classList.toggle('fw-bold', lang === 'pt-br');
    }
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
        setTheme(savedTheme);
    } else {
        setTheme("usa");
    }
    const savedLang = localStorage.getItem("language") || "en-us";
    selectedCategory = localStorage.getItem('category') || 'male-adult';
    setLanguage(savedLang);
    renderUserInfo();

    // Gender/category dropdown highlight
    function updateGenderDropdown() {
      const select = document.getElementById('gender-category-select');
      for (let i = 0; i < select.options.length; i++) {
        if (select.options[i].selected) {
          select.options[i].classList.add('fw-bold', 'bg-primary', 'text-white');
        } else {
          select.options[i].classList.remove('fw-bold', 'bg-primary', 'text-white');
        }
      }
    }
    // Call after DOM loads
    setTimeout(updateGenderDropdown, 100);

    // Update dropdown rendering
    function renderCategoryDropdown() {
      const lang = localStorage.getItem('language') || 'en-us';
      const select = document.getElementById('gender-category-select');
      const current = localStorage.getItem('category') || 'male-adult';
      select.innerHTML = '';
      categoryOptions[lang].forEach(opt => {
        const option = document.createElement('option');
        option.value = opt.value;
        option.textContent = opt.label;
        if (opt.value === current) option.selected = true;
        select.appendChild(option);
      });
    }
    // Call after DOM loads and on language change
    setTimeout(renderCategoryDropdown, 100);
</script>
</body>
</html>
