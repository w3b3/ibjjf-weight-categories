<body class="bg-dark">
<div>
    <header class="text-bg-success p-1 d-flex flex-row justify-content-around align-items-center" style="max-width: 800px; margin: auto">
        <h1 class="p-3" id="title_weight_categories">
            Loading...
        </h1>
        <img
                alt="CA Flag"
                id="usa-flag"

                onclick="setTheme('usa')"
                src="https://flagsapi.com/CA/flat/32.png"
        />
        <img
                alt="Brazil Flag"
                id="brazil-flag"

        />

    <div class="text-bg-warning p-1 d-flex flex-row justify-content-around align-items-center">
        <!--      add a disabled dropdown with the option "MALE - ADULT"-->
        <select aria-label="Default select example" disabled>
            <option selected>MALE - ADULT</option>
        </select>
        <button disabled>Login</button>
    </div>
</div>
<div>
    <div
            class="p-3 d-flex flex-row flex-wrap justify-content-around align-items-center"
            id="category-buttons-container"
    ></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const translations = {

            },
            "Light Feather": {

            },

            },
            Middle: {

            },
            "Medium Heavy": {

            },
            Heavy: {

            },
            "Super Heavy": {

            },
            "Ultra Heavy": {
                name: "Ultra Heavy",

            },
        },
        "pt-br": {
            Rooster: {
                name: "Galo",

                weightLbs: "127 lbs",
            },
            "Light Feather": {
                name: "Pluma Leve",
                weightKg: "64 kg",
                weightLbs: "141 lbs",
            },
            Feather: {
                name: "Pluma",
                weightKg: "70 kg",
                weightLbs: "154 lbs",
            },
            Light: {
                name: "Leve",
                weightKg: "76 kg",
                weightLbs: "167,5 lbs",
            },
            Middle: {
                name: "Médio",
                weightKg: "82,3 kg",
                weightLbs: "181,5 lbs",
            },
            "Medium Heavy": {
                name: "Meio-Pesado",
                weightKg: "88,3 kg",
                weightLbs: "194,5 lbs",
            },
            Heavy: {
                name: "Pesado",
                weightKg: "94,3 kg",
                weightLbs: "208 lbs",
            },
            "Super Heavy": {
                name: "Super Pesado",
                weightKg: "100,5 kg",
                weightLbs: "221,5 lbs",
            },
            "Ultra Heavy": {
                name: "Pesadíssimo",
                weightKg: "> 100,5 kg",
                weightLbs: "> 221,5 lbs",
            },
        },
    };

    // needs to be reassigned after being set in the script tag
    let votedCategory = localStorage.getItem("votedCategory");
    const categoryButtonsContainer = document.getElementById(
        "category-buttons-container"
    );

    if (votedCategory) {
        disableAllButtons();
        alert("You have already voted for: " + votedCategory);
    }

    async function submitResponse(category) {
        if (votedCategory) return;

        try {
            // const response = await fetch("/submit", {
            //     method: "POST",
            //     headers: {
            //         "Content-Type": "application/json",
            //     },
            //     body: JSON.stringify({category}), // Send only the category
            // });

            // const data = await response.json();
            // if (response.ok) {
            if (true) {
                localStorage.setItem("votedCategory", category);
                votedCategory = category;
                disableAllButtons();
                // alert(data.message);
                // No need to fetch results here anymore
            } else {
                // alert(data.error);
            }
        } catch (error) {
            console.error("Error submitting response:", error);
            alert("An error occurred. Please try again later.");
        }
    }

    function disableAllButtons() {
        const buttons = document.getElementsByTagName("button");
        // buttons.forEach is not a function, so we need to convert it to an array first
        const buttonsArray = Array.from(buttons);
        buttonsArray.forEach((button) => {
            button.classList.add("disabled");
            button.disabled = true;
        });
        // find the one with the id, and navigate to the parent element to remove the disabled class 
        const parent = document.getElementById(votedCategory.toLowerCase()).parentElement;
        parent.classList.remove("disabled");
        parent.disabled = false;
    }

    function setTheme(theme) {
        if (theme === "usa") {
            document.body.classList.remove("brazil-theme");
            document.body.classList.add(theme + "-theme");
            setLanguage("en-us");
            //   find the element with ID title_weight_categories and set the title based on the language
            document.getElementById("title_weight_categories").innerText =
                "IBJJF Weight Categories";
            //   window.location.href = "https://weight.brasileiro.ca";
        } else {
            document.body.classList.remove("usa-theme");
            document.body.classList.add(theme + "-theme");
            setLanguage("pt-br");
            //   find the element with ID title_weight_categories and set the title based on the language
            document.getElementById("title_weight_categories").innerText =
                "Categorias de Peso CBJJ";
            //   window.location.href = "https://peso.brasileiro.ca";
        }
        localStorage.setItem("theme", theme);
    }

    function loadCategories(lang) {
        categoryButtonsContainer.innerHTML = "";
        const isUSA = document.body.classList.contains("usa-theme");

        const categories = [
            "Rooster",
            "Light Feather",
            "Feather",
            "Light",
            "Middle",
            "Medium Heavy",
            "Heavy",
            "Super Heavy",
            "Ultra Heavy",
        ];

        categories.forEach((category) => {
            const localizedData = translations[lang][category];
            const primaryWeight = isUSA
                ? localizedData.weightLbs
                : localizedData.weightKg;
            const secondaryWeight = isUSA
                ? localizedData.weightKg
                : localizedData.weightLbs;

            const button = document.createElement("button");
            // max width should be 50% of the container on mid to large screens, and 100 on small screens
            button.classList.add("w-75", "mb-2", "category-button", "btn", "btn-secondary", "btn-sm");
            // set max width to a fixed value
            button.style.maxWidth = "300px";
            button.innerHTML = `
              <div onclick="submitResponse('${category}')" id="${category.toLowerCase()}">
                <h3 class="">${localizedData.name}</h3>
                  <h2 class="text-bg-info fw-bolder ">${primaryWeight}</h2>
              </div>
          `;
            categoryButtonsContainer.appendChild(button);
        });

        if (votedCategory) {
            disableAllButtons();
        }
    }

    function setLanguage(lang) {
        localStorage.setItem("language", lang);
        loadCategories(lang);
    }

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
        setTheme(savedTheme);
    } else {
        setTheme("usa");
    }

    const savedLang = localStorage.getItem("language") || "en-us";
    setLanguage(savedLang);
</script>
</body>
</html>
